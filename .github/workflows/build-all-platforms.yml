name: Build All Platforms (Mac + Windows + Linux)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (optional, used for release)'
        required: false
      create_release:
        description: 'Create GitHub Release with artifacts'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # macOS: arm64 (Apple Silicon) + x64 (Intel)
  # ─────────────────────────────────────────────
  build-macos-arm64:
    name: macOS arm64 (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & package macOS arm64 DMG + ZIP
        run: npm run dist:mac:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joker-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Joker-*-mac-arm64.dmg
            dist/Joker-*-mac-arm64.zip

  build-macos-x64:
    name: macOS x64 (Intel)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & package macOS x64 DMG + ZIP
        run: npm run dist:mac:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joker-macos-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Joker-*-mac-x64.dmg
            dist/Joker-*-mac-x64.zip

  # ─────────────────────────────────────────────
  # Windows: x64 NSIS installer
  # ─────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_msvs_version: 2022

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joker-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Joker-*-win-x64.exe
            dist/Joker-*-win-x64.exe.blockmap
            dist/latest.yml

  # ─────────────────────────────────────────────
  # Linux: x64 AppImage
  # ─────────────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss1 \
            libxtst6 \
            libatspi2.0-dev \
            libdrm-dev \
            libgbm-dev \
            libasound2 \
            libpulse-dev \
            libcurl4-openssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joker-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Joker-*-x64.AppImage

  # ─────────────────────────────────────────────
  # Release: download all artifacts & create release
  # ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    if: ${{ github.event.inputs.create_release == 'true' }}
    needs: [build-macos-arm64, build-macos-x64, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=v$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --title "Joker $TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            artifacts/joker-macos-arm64/* \
            artifacts/joker-macos-x64/* \
            artifacts/joker-windows-x64/* \
            artifacts/joker-linux-x64/*

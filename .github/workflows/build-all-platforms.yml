name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # macOS: arm64 (Apple Silicon) + x64 (Intel)
  # ─────────────────────────────────────────────
  build-macos:
    name: Build macOS DMG + ZIP (arm64 & x64)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build full app
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package macOS arm64 DMG
        run: npm run dist:mac:arm64:dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package macOS arm64 ZIP
        run: npm run dist:mac:arm64:zip

      - name: Package macOS x64 DMG
        run: npm run dist:mac:x64:dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package macOS x64 ZIP
        run: npm run dist:mac:x64:zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joker-macos
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Joker-*-mac-arm64.dmg
            dist/Joker-*-mac-arm64.zip
            dist/Joker-*-mac-x64.dmg
            dist/Joker-*-mac-x64.zip

  # ─────────────────────────────────────────────
  # Windows: x64 NSIS installer
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_msvs_version: 2022

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joker-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Joker-*-win-x64.exe
            dist/Joker-*-win-x64.exe.blockmap
            dist/latest.yml

  # ─────────────────────────────────────────────
  # Linux: x64 AppImage
  # ─────────────────────────────────────────────
  build-linux:
    name: Build Linux x64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libnotify-dev \
            libnss3-dev \
            libxss1 \
            libxtst6 \
            libatspi2.0-dev \
            libdrm-dev \
            libgbm-dev \
            libasound2-dev \
            libpulse-dev \
            libcurl4-openssl-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joker-linux
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Joker-*-linux-x86_64.AppImage

  # ─────────────────────────────────────────────
  # Release: create GitHub Release with all assets
  # ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: joker-macos
          path: artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: joker-windows
          path: artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: joker-linux
          path: artifacts

      - name: List all artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          PRERELEASE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Delete existing release if present (allows re-runs on the same tag)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Joker $TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            artifacts/Joker-* \
            artifacts/latest.yml

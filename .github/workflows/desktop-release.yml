name: Desktop Release (Mac + Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0'
        required: true
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS arm64 DMG
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package macOS arm64 DMG + ZIP
        # dist:mac:arm64 内部会先执行完整 build 再打包 dmg/zip
        run: npm run dist:mac:arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged native architecture
        run: node ./scripts/verify-packaged-macos-native-architecture.cjs --resources "dist/mac-arm64/Rcode.app/Contents/Resources" --arch arm64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rcode-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Rcode-*-mac-arm64.dmg
            dist/Rcode-*-mac-arm64.zip

  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_msvs_version: 2022

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rcode-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/Rcode-*-win-x64.exe
            dist/Rcode-*-win-x64.exe.blockmap
            dist/latest.yml

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          PRERELEASE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "Rcode $TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            artifacts/rcode-macos-arm64/*
          gh release upload "$TAG" \
            artifacts/rcode-windows-x64/* \
            --clobber
